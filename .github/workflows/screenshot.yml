name: Emulator screenshot test
on:
  pull_request:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:
    inputs:
      config:
        description: 'Repository-relative JSON configuration'
        type: string
        default: ci/android/configs/sample.json
      mode:
        description: 'verify compares, record captures a candidate, deploy republishes the existing archive'
        type: choice
        options: [verify, record, deploy]
        default: verify
      publish_pages:
        description: 'Archive the screenshots and report on GitHub Pages (main only)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  screenshot:
    if: ${{ inputs.mode != 'deploy' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["selected"]') || fromJSON('["light","dark"]') }}
    env:
      SCREENSHOT_MODE: ${{ inputs.mode || 'verify' }}
      SCREENSHOT_CONFIG: ${{ inputs.config || (matrix.theme == 'dark' && 'ci/android/configs/sample-dark.json' || 'ci/android/configs/sample.json') }}
      SCREENSHOT_OUT: ${{ github.workspace }}/artifacts/screenshot
      SCREENSHOT_VALIDATION_OUT: ${{ github.workspace }}/artifacts/smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install build and comparison tools
        run: |
          sdkmanager 'platforms;android-35' 'platforms;android-37.1' 'build-tools;37.0.0'
          python3 -m pip install -r requirements.txt
      - name: Test comparison and image revision guard
        run: python3 -m unittest discover -s tests -v
      - name: Validate screenshot configuration
        run: python3 ci/android/run-screenshot.py --config "$SCREENSHOT_CONFIG" --mode "$SCREENSHOT_MODE" --output "$RUNNER_TEMP/screenshot-config" --validate-only
      - name: Enable KVM on the GitHub-hosted runner
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run screenshot test on an emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-build: '16740729'
          ram-size: 3072M
          heap-size: 256M
          cores: 2
          disable-animations: true
          pre-emulator-launch-script: python3 ci/android/check-system-image.py
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -memory 3072 -cores 2 -camera-back none -camera-front none -feature -Vulkan
          script: |
            python3 ci/android/run-screenshot.py --config "$SCREENSHOT_CONFIG" --mode "$SCREENSHOT_MODE" --output "$SCREENSHOT_OUT" --smoke-output "$SCREENSHOT_VALIDATION_OUT" --recover-launcher-anr
      - name: Render report even when comparison fails
        if: ${{ !cancelled() }}
        env:
          SCREENSHOT_OUTCOME: ${{ steps.emulator.outcome || 'skipped' }}
        run: python3 ci/android/report.py render --artifacts artifacts --output artifacts/report --outcome "$SCREENSHOT_OUTCOME"
      - name: Upload screenshots even when comparison fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots-${{ github.run_id }}-${{ github.run_attempt }}${{ matrix.theme == 'dark' && '-dark' || '' }}
          path: artifacts/
          if-no-files-found: warn

  archive:
    needs: screenshot
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_pages && inputs.mode != 'deploy' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: emulator-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/screenshot-artifact
      - name: Append report to gh-pages
        run: bash ci/android/archive-report.sh "$RUNNER_TEMP/screenshot-artifact/report"

  deploy:
    needs: archive
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_pages && (needs.archive.result == 'success' || inputs.mode == 'deploy') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: screenshot-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: false
      - uses: actions/upload-pages-artifact@v5.0.0
        id: pages_upload
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: .
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_upload.outputs.artifact_id }}
        run: |
          if [[ ! "$PAGES_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo '::error::Pages upload did not return an artifact ID'
            exit 1
          fi
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT_NAME"
          for attempt in 1 2 3 4 5 6; do
            if ids=$(timeout 7s gh api "$endpoint" --jq '.artifacts[] | select(.expired == false) | .id') &&
               [[ "$ids" == "$PAGES_ARTIFACT_ID" ]]; then
              printf 'Pages artifact %s is visible as %s.\n' "$PAGES_ARTIFACT_ID" "$PAGES_ARTIFACT_NAME"
              exit 0
            fi
            if [[ "$attempt" != 6 ]]; then sleep 3; fi
          done
          echo '::error::The uploaded Pages artifact did not become visible as a unique artifact for this run attempt'
          exit 1
      - name: Deploy the report archive
        uses: actions/deploy-pages@v5.0.1
        id: deployment
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
