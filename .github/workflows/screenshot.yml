name: Emulator screenshot test
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify compares; record uploads a candidate without changing the reference'
        type: choice
        options: [verify, record]
        default: verify
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SCREENSHOT_MODE: ${{ inputs.mode || 'verify' }}
      SCREENSHOT_OUT: ${{ github.workspace }}/artifacts/screenshot
      SCREENSHOT_VALIDATION_OUT: ${{ github.workspace }}/artifacts/smoke
      REFERENCE_PNG: ${{ github.workspace }}/ci/android/reference/sample.png
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install build and comparison tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          python3 -m pip install -r requirements.txt
      - name: Test comparison and image revision guard
        run: python3 -m unittest discover -s tests -v
      - name: Enable KVM on the GitHub-hosted runner
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run screenshot test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-build: '16740729'
          ram-size: 3072M
          heap-size: 256M
          cores: 4
          disable-animations: true
          pre-emulator-launch-script: python3 ci/android/check-system-image.py
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -memory 3072 -cores 4 -camera-back none -camera-front none -feature -Vulkan
          script: |
            bash ci/android/ci-check.sh
            python3 ci/android/smoke.py
      - name: Upload screenshots even when comparison fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
